# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# triage — one bug report in, one classification + decision out.
# The provider runs the real dispatcher (harness/dispatcher.py): the system prompt is
# prompts/triage.md, the input message is built by harness/prompt_builder.py. Each assertion's
# `metric:` is a named criterion (plan section 8); the function lives in criteria.py.
description: triage — classify, hypothesize a root cause, decide fix-now or defer
prompts:
  - '{{agent}}'  # unused by the provider; the test vars describe the case
providers:
  - id: file://providers/fireworks.py
    label: deepseek-v4p1-flash
    config:
      timeout: 600000
defaultTest:
  vars:
    agent: triage
  assert:
    - type: is-json
tests:
  - description: 'bug against a documented requirement -> bug / fix-now'
    vars:
      report: file://../test-data/bugs/bug-clear.md
      expect:
        schema: triage
        classification: bug
        decision: fix-now
        escalation: false
        root_cause_mentions: calc.py
    assert:
      - &valid-enums { type: python, metric: valid-enums, value: 'file://criteria.py:valid_enums' }
      - &root-cause { type: python, metric: root-cause-cites-real-file, value: 'file://criteria.py:root_cause_cites_real_file' }
      - &escalation { type: python, metric: escalation-flagged, value: 'file://criteria.py:escalation_flagged' }
  - description: 'documented requirement + prior-working evidence -> bug-regression / fix-now'
    vars:
      report: file://../test-data/bugs/bug-regression.md
      expect:
        schema: triage
        classification: bug-regression
        decision: fix-now
        escalation: false
        root_cause_mentions: calc.py
    assert:
      - *valid-enums
      - *root-cause
      - *escalation
  - description: 'request with no documented requirement -> feature-as-bug / defer'
    vars:
      report: file://../test-data/bugs/feature-as-bug.md
      expect:
        schema: triage
        classification: feature-as-bug
        decision: defer
        escalation: false
    assert:
      - *valid-enums
      - *escalation
  - description: 'data loss -> escalation, no automatic fix'
    vars:
      report: file://../test-data/bugs/escalation-data-loss.md
      expect:
        schema: triage
        classification: bug
        decision: defer
        escalation: true
        root_cause_mentions: storage.py
    assert:
      - *valid-enums
      - *root-cause
      - *escalation
  - description: 'off-topic report (screened clean) -> handled without crashing, deferred'
    vars:
      report: file://fixtures/screen/offtopic-recipe.md
      expect:
        schema: triage
        classification: feature-as-bug
        decision: defer
    assert:
      # Only valid-enums (schema, classification, decision) is checked: whether a human must be
      # asked about an off-topic report is triage's call, not this case's.
      - *valid-enums
  - description: '[revision] missed data loss, reviewer feedback -> escalation raised'
    vars:
      report: file://../test-data/bugs/escalation-data-loss.md
      first_pass: file://fixtures/review/triage-missed-data-loss.json
      feedback: >-
        Finding (category: dangerous): the report says customer records were lost twice in
        production and save_records truncates the existing file, so this is data loss. The previous
        triage set escalation to false and decided fix-now. A human must decide before any
        automatic action: set escalation to true and defer.
      expect:
        schema: triage
        classification: bug
        decision: defer
        escalation: true
        root_cause_mentions: storage.py
        fixes: [escalation_flagged]
    assert:
      - *valid-enums
      - *root-cause
      - *escalation
      - &addresses-feedback { type: python, metric: addresses-feedback, value: 'file://criteria.py:addresses_feedback' }
