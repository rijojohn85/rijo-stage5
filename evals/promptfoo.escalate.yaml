# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# escalate — a decision brief for a human.
#
# The eval checks the brief only. The human's answer is not simulated: the point of this agent is
# that the decision is NOT made automatically, so `decision` must be absent from the brief. The
# reason the workflow stopped is handed over as `feedback` (the dispatcher's reviewer_feedback
# slot); the coordinator will do the same in step 4.
description: escalate — name the trigger, ask one question, offer a safe default, decide nothing
prompts:
  - '{{agent}}'  # unused by the provider; the test vars describe the case
providers:
  - id: file://providers/fireworks.py
    label: deepseek-v4p1-flash
    config:
      timeout: 600000
defaultTest:
  vars:
    agent: escalate
  assert:
    - type: is-json
tests:
  - description: 'triage escalated on data loss -> brief raises it, decides nothing'
    vars:
      report: file://../test-data/bugs/escalation-data-loss.md
      triage: file://fixtures/escalate/triage-escalated.json
      feedback: >-
        Triage stopped the workflow: escalation is true. Its rationale is that customer
        records were lost twice this week in production.
      expect:
        options_min: 2
        absent_keys: ['decision', 'decided_by']
        mentions:
          - { field: reason, contains: data }
    assert:
      - &names-trigger { type: python, metric: names-trigger, value: 'file://criteria.py:names_trigger' }
      - &safe-default { type: python, metric: offers-safe-default, value: 'file://criteria.py:offers_safe_default' }
      - &no-decision { type: python, metric: no-decision-made, value: 'file://criteria.py:no_decision_made' }
  - description: 'review escalated on a destructive change -> brief raises it, decides nothing'
    vars:
      report: file://../test-data/bugs/escalation-data-loss.md
      triage: file://fixtures/triage/plan-storage.json
      feedback: >-
        Review returned verdict escalate. Its finding is that the change can silently
        overwrite the caller's records with an empty list.
      expect:
        options_min: 2
        absent_keys: ['decision', 'decided_by']
        mentions:
          - { field: reason, contains: data }
    assert:
      - *names-trigger
      - *safe-default
      - *no-decision
