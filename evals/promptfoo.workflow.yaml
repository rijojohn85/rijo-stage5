# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# workflow — a bug report in, one terminal state out, through the real coordinator and real sub-agents.
#
# Each case is one live run of harness.run (glm-5p3 coordinator, deepseek-v4p1-flash sub-agents) with
# nothing canned. Run it with --repeat 3; the provider resets sandbox/ before and after every run.
# Criteria read the run's own audit trail (evals/run_trace.py):
#   terminal-state  the run ended in the state the report calls for
#   step-count      dispatches, reviews included, are within the expected range
#   audit-complete  one correlation id, every line complete, every artifact on disk, a cost recorded
#
# Expected states are Stage 4's: bug-clear and bug-regression are fixed and VERIFIED, a feature
# request filed as a bug is DEFERRED at triage, and the data-loss report stops at HUMAN_PUNCH_OUT.
# The step ranges: fix-now needs 8 (three producers and the writer, each reviewed) and allows each
# of the three producers one replacement with its re-review; defer needs 4; escalate needs 6.
description: workflow — real coordinator and helpers, a bug report in and a legal terminal state out
prompts:
  - '{{case}}'  # unused by the provider; the test vars describe the case
providers:
  - id: file://providers/workflow.py
    label: stage5-workflow
    config:
      timeout: 1800000
defaultTest:
  assert:
    - type: is-json
    - { type: python, metric: terminal-state, value: 'file://criteria.py:terminal_state_reached' }
    - { type: python, metric: step-count, value: 'file://criteria.py:step_count_in_range' }
    - { type: python, metric: audit-complete, value: 'file://criteria.py:audit_complete' }
tests:
  - description: 'bug-clear -> VERIFIED'
    vars:
      report: file://../test-data/bugs/bug-clear.md
      expect: { result: VERIFIED, steps_min: 8, steps_max: 16 }
  - description: 'bug-regression -> VERIFIED'
    vars:
      report: file://../test-data/bugs/bug-regression.md
      expect: { result: VERIFIED, steps_min: 8, steps_max: 16 }
  - description: 'feature-as-bug -> DEFERRED'
    vars:
      report: file://../test-data/bugs/feature-as-bug.md
      expect: { result: DEFERRED, steps_min: 4, steps_max: 8 }
  - description: 'escalation-data-loss -> HUMAN_PUNCH_OUT'
    vars:
      report: file://../test-data/bugs/escalation-data-loss.md
      expect: { result: HUMAN_PUNCH_OUT, steps_min: 6, steps_max: 12 }
