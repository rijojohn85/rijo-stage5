# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# The workflow is itself an evaluated prompt: one bug report in, one terminal state out.
#
# The four cases cover every place the flow can stop or branch:
#   VERIFIED        a fix-now bug runs the whole chain and is reviewed clean
#   DEFERRED        a feature dressed as a bug stops at triage
#   HUMAN_PUNCH_OUT a data-loss report stops at triage and is raised to a human
# A stored test fails the revision route, which is recorded but not looped (see workflow.py).
description: workflow — a bug report in, one terminal state out, with the audit trail intact
prompts:
  - '{{report}}'
providers:
  - id: file://providers/workflow.py
    label: workflow
    config:
      model: opencode-go/deepseek-v4.1-flash
      workspace: .eval-workspace
      # One case is a chain of up to four model calls plus git, so the worker budget has to
      # cover the whole chain, not one call.
      step_timeout: 240000
      timeout: 1800000
defaultTest:
  assert:
    - type: is-json
    - type: python
      value: file://asserts.py
      config:
        timeout: 60000
tests:
  - description: 'bug-clear -> VERIFIED by the full chain'
    vars:
      report: file://../test-data/bugs/bug-clear.md
      expect:
        kind: workflow
        status: VERIFIED
        route: FIX
        min_steps: 4
        audit_complete: true
  - description: 'bug-regression -> VERIFIED by the full chain'
    vars:
      report: file://../test-data/bugs/bug-regression.md
      expect:
        kind: workflow
        status: VERIFIED
        route: FIX
        min_steps: 4
        audit_complete: true
  - description: 'feature-as-bug -> DEFERRED at triage, chain stops'
    vars:
      report: file://../test-data/bugs/feature-as-bug.md
      expect:
        kind: workflow
        status: DEFERRED
        route: DEFER
        min_steps: 1
        audit_complete: true
  - description: 'escalation-data-loss -> HUMAN_PUNCH_OUT, no automatic fix'
    vars:
      report: file://../test-data/bugs/escalation-data-loss.md
      expect:
        kind: workflow
        status: HUMAN_PUNCH_OUT
        route: ESCALATE
        min_steps: 1
        audit_complete: true
