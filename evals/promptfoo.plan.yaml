# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# plan — a triage result in, a fix plan out.
# Inputs are saved triage artifacts (seeded into the run as already reviewed and passing), so
# the eval is deterministic and does not depend on re-running triage first. The provider runs
# the real dispatcher; each `metric:` is a named criterion implemented in criteria.py.
description: plan — name the files the fix may touch, the steps, and the test
prompts:
  - '{{agent}}'  # unused by the provider; the test vars describe the case
providers:
  - id: file://providers/fireworks.py
    label: deepseek-v4p1-flash
    config:
      timeout: 600000
defaultTest:
  vars:
    agent: plan
  assert:
    - type: is-json
tests:
  - description: 'empty-list bug -> plan touches only calc.py'
    vars:
      report: file://../test-data/bugs/bug-clear.md
      triage: file://fixtures/triage/plan-calc.json
      expect:
        files_include: ['sandbox/demo-app/calc.py']
        files_exclude: ['sandbox/demo-app/storage.py', 'sandbox/demo-app/SPEC.md']
        test_mentions: average
    assert:
      - &right-file { type: python, metric: names-right-file, value: 'file://criteria.py:names_right_file' }
      - &wrong-files { type: python, metric: excludes-wrong-files, value: 'file://criteria.py:excludes_wrong_files' }
      - &test-target { type: python, metric: test-targets-function, value: 'file://criteria.py:targets_function' }
  - description: 'regression -> same single-file plan'
    vars:
      report: file://../test-data/bugs/bug-regression.md
      triage: file://fixtures/triage/plan-calc-regression.json
      expect:
        files_include: ['sandbox/demo-app/calc.py']
        files_exclude: ['sandbox/demo-app/storage.py', 'sandbox/demo-app/SPEC.md']
        test_mentions: average
    assert:
      - *right-file
      - *wrong-files
      - *test-target
  - description: 'storage write bug -> plan touches only storage.py'
    vars:
      triage: file://fixtures/triage/plan-storage.json
      expect:
        files_include: ['sandbox/demo-app/storage.py']
        files_exclude: ['sandbox/demo-app/calc.py', 'sandbox/demo-app/SPEC.md']
        test_mentions: save_records
    assert:
      - *right-file
      - *wrong-files
      - *test-target
  - description: '[revision] wrong file, reviewer feedback -> plan moves to calc.py'
    vars:
      report: file://../test-data/bugs/bug-clear.md
      triage: file://fixtures/triage/plan-calc.json
      first_pass: file://fixtures/review/plan-wrong-file.json
      feedback: >-
        Finding (category: incorrect): the previous plan names sandbox/demo-app/storage.py, but the
        defect is average() in sandbox/demo-app/calc.py, so the plan edits the wrong file. Name
        sandbox/demo-app/calc.py and do not list storage.py.
      expect:
        files_include: ['sandbox/demo-app/calc.py']
        files_exclude: ['sandbox/demo-app/storage.py', 'sandbox/demo-app/SPEC.md']
        test_mentions: average
        fixes: [names_right_file, excludes_wrong_files]
    assert:
      - *right-file
      - *wrong-files
      - *test-target
      - &addresses-feedback { type: python, metric: addresses-feedback, value: 'file://criteria.py:addresses_feedback' }
