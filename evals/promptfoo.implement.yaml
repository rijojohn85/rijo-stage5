# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# implement — a plan in, a minimal applied fix out, proved by the plan's new test files.
#
# This eval EDITS files. The provider copies sandbox/ into a throwaway git repository for every
# case (providers/scratch_workspace.py), so the real sandbox keeps its bugs and each case starts
# from the same baseline. The provider also measures, outside the model, what git says changed and
# whether the plan's test_files really went red to green (criteria.py reads that from the metadata):
# red = the implementer's new test file, replayed on a fresh copy of the ORIGINAL code, fails
# (pytest exit 1); green = the same file passes in the edited workspace.
description: implement — create the plan's test files, apply the plan, change only its files, run its tests
prompts:
  - '{{agent}}'  # unused by the provider; the test vars describe the case
providers:
  - id: file://providers/fireworks.py
    label: deepseek-v4p1-flash
    config:
      timeout: 900000
defaultTest:
  vars:
    agent: implement
  assert:
    - type: is-json
tests:
  - description: 'calc empty-list plan -> changes only calc.py, test passes'
    vars:
      report: file://../test-data/bugs/bug-clear.md
      triage: file://fixtures/triage/plan-calc.json
      plan: file://fixtures/plan/impl-calc.json
      expect:
        files_include: ['sandbox/demo-app/calc.py']
    assert:
      - &plan-files { type: python, metric: changes-only-plan-files, value: 'file://criteria.py:changes_only_plan_files' }
      - &red-green { type: python, metric: test-red-to-green, value: 'file://criteria.py:red_to_green' }
      - &unreported { type: python, metric: no-unreported-edits, value: 'file://criteria.py:no_unreported_edits' }
  - description: 'storage truncation plan -> changes only storage.py, test passes'
    vars:
      triage: file://fixtures/triage/plan-storage.json
      plan: file://fixtures/plan/impl-storage.json
      expect:
        files_include: ['sandbox/demo-app/storage.py']
    assert:
      - *plan-files
      - *red-green
      - *unreported
  - description: '[revision] edit outside the plan and failing test, reviewer feedback -> in scope and green'
    vars:
      report: file://../test-data/bugs/bug-clear.md
      triage: file://fixtures/triage/plan-calc.json
      plan: file://fixtures/plan/impl-calc.json
      first_pass: file://fixtures/revision/impl-calc-out-of-scope.json
      feedback: >-
        Findings (category: incorrect): the previous change edited sandbox/demo-app/storage.py,
        which the plan does not name, and the plan's test still fails. Change only the files the
        plan names and make the plan's test pass.
      expect:
        files_include: ['sandbox/demo-app/calc.py']
        fixes: [changes_only_plan_files, red_to_green]
    assert:
      - *plan-files
      - *red-green
      - *unreported
      - &addresses-feedback { type: python, metric: addresses-feedback, value: 'file://criteria.py:addresses_feedback' }
